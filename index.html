<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement à l'examen civique</title>
<style>
:root{--c-strong:#0e9f7e;--c-weak:#e5484d;--bg:#f6f7fb;--card:#fff;--ink:#16213a;--mute:#5d6783;--line:#d9deea;--accent:#1f3f9e;--accent-ink:#fff;--ok:#16794a;--okbg:#e4f5ec;--ko:#b3261e;--kobg:#fbe9e7;--r:10px}
@media (prefers-color-scheme:dark){:root{--c-strong:#34d3a8;--c-weak:#ff7a7f;--bg:#0f1526;--card:#171f36;--ink:#e8ecf7;--mute:#9aa5c4;--line:#2b3556;--accent:#6f93ff;--accent-ink:#0f1526;--ok:#5fd29a;--okbg:#12302a;--ko:#ff8a80;--kobg:#3a1c1f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:700 1.3rem/1.35 Georgia,"Times New Roman",serif;margin:0 0 16px}
p.sub{color:var(--mute);margin:0 0 20px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:0 0 12px;padding:10px 14px 12px}
legend{font-weight:600;padding:0 6px}
label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
input[type=checkbox],input[type=radio]{margin-top:5px;accent-color:var(--accent)}
.count{color:var(--mute);white-space:nowrap;margin-left:auto;padding-left:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.row>fieldset{flex:1 1 240px;margin:0}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.mini{display:flex;gap:8px;margin:0 0 12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:12px 20px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.link{background:none;border:0;color:var(--accent);padding:2px 4px;text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.fb{min-height:1.6em;font-weight:600;margin:4px 0 14px}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.score{font:700 3rem/1 Georgia,serif;margin:8px 0}
.err{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ko);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.err p{margin:2px 0}.bad{color:var(--ko)}.good{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

h3{margin:0 0 6px;font-size:1rem}
.mute{color:var(--mute)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px}
.tabs button{flex:1;background:none;border:0;border-radius:9px;padding:9px;color:var(--mute);font-weight:600}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.cards div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;text-align:center}
.cards b{display:block;font:700 1.35rem/1.2 Georgia,serif}.cards span{color:var(--mute);font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px 10px;margin:0 0 14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 8px}
.chip{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;padding:4px 12px 4px 10px;border-radius:99px;background:var(--bg)}
.chip::before{content:"";width:18px;height:4px;border-radius:2px}
.chip.s::before{background:var(--c-strong)}.chip.w::before{background:var(--c-weak)}
.wrap{position:relative}
#cs{width:100%;height:auto;display:block;touch-action:pan-y}
.g{stroke:var(--line);stroke-dasharray:3 5}
.ax{fill:var(--mute);font-size:11px}
.ln{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.ln{stroke:var(--c)}
.area{animation:fade 1.4s ease-out both}
.dot{stroke:var(--card);stroke-width:2.5}.dot{fill:var(--c)}
.hl{fill:none;stroke-width:2.5;stroke:var(--c)}
.gd{stroke:var(--mute);stroke-width:1;opacity:0}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:.8rem;line-height:1.5;pointer-events:none;width:max-content;max-width:min(320px,80vw);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip span{display:flex;gap:10px;justify-content:space-between}.tip span::before{content:"●";color:var(--c)}.tip span i{flex:1;font-style:normal}
.tl{transition:opacity .15s}.fx .tl:not(.on){opacity:.1}.fx .tl.on .ln{stroke-width:4.6}
.chip{cursor:pointer;border:1.5px solid transparent;color:var(--ink);font-family:inherit}.chip.on{border-color:var(--accent);background:var(--card)}.chip:disabled{opacity:.4;cursor:not-allowed}.chip.a::before{background:var(--mute)}
.lgs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 2px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px 3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left}
.lg::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}.lg.off{opacity:.45;text-decoration:line-through}
.hint{font-size:.78rem;color:var(--mute);margin:8px 4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.col{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:var(--r);padding:10px 12px}
.col.s{border-top-color:var(--c-strong)}.col.w{border-top-color:var(--c-weak)}
.col p{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:.88rem}
.tbl{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 12px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mute);font-weight:600;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
.pill{padding:2px 9px;border-radius:99px;font-weight:600;font-size:.82rem;background:var(--bg)}
.pill.hi{background:var(--okbg);color:var(--ok)}.pill.lo{background:var(--kobg);color:var(--ko)}
.note{background:var(--okbg);color:var(--ok);padding:8px 12px;border-radius:8px}.note.bad{background:var(--kobg);color:var(--ko)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.area{animation:none}}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"title":"Questions civiques","total":209,"quizzes":[{"id":1,"title":"Valeurs de la République, Citoyenneté et Laïcité","themes":["Valeurs de la République","République et citoyenneté","Laïcité et liberté de conscience"],"count":40,"questions":[{"number":1,"theme":"Valeurs de la République","question":"Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?","options":[{"id":"A","text":"Ignorer les élections"},{"id":"B","text":"Voter aux élections"},{"id":"C","text":"Refuser de s’inscrire sur les listes électorales"},{"id":"D","text":"Ne pas lire les programmes politiques"}],"answer":"B","id":"q1-1"},{"number":2,"theme":"Valeurs de la République","question":"Que garantit la liberté d’expression ?","options":[{"id":"A","text":"Le droit de tout imposer sans limites"},{"id":"B","text":"Le droit de censurer les autres"},{"id":"C","text":"Le droit de dire uniquement la vérité officielle"},{"id":"D","text":"Le droit d’exprimer ses opinions dans le respect de la loi"}],"answer":"D","id":"q1-2"},{"number":3,"theme":"Valeurs de la République","question":"À quoi sert un titre de séjour ?","options":[{"id":"A","text":"À prouver la nationalité française"},{"id":"B","text":"À autoriser un étranger à séjourner légalement en France"},{"id":"C","text":"À voter aux élections présidentielles"},{"id":"D","text":"À obtenir automatiquement un emploi"}],"answer":"B","id":"q1-3"},{"number":4,"theme":"Valeurs de la République","question":"La liberté de circulation permet à toute personne de :","options":[{"id":"A","text":"Voyager librement dans les limites de la loi"},{"id":"B","text":"Rester uniquement dans son pays de naissance"},{"id":"C","text":"Être obligée de rester dans sa région"},{"id":"D","text":"Voyager uniquement avec autorisation policière"}],"answer":"A","id":"q1-4"},{"number":5,"theme":"Valeurs de la République","question":"Sur quel site internet peut-on retrouver le symbole de la République française ?","options":[{"id":"A","text":"wikipedia.org"},{"id":"B","text":"elysee.fr"},{"id":"C","text":"amazon.fr"},{"id":"D","text":"netflix.com"}],"answer":"B","id":"q1-5"},{"number":6,"theme":"Valeurs de la République","question":"Complétez ces paroles de la Marseillaise : \"Aux armes […] ! Formez vos bataillons\"","options":[{"id":"A","text":"soldats"},{"id":"B","text":"citoyens"},{"id":"C","text":"français uniquement"},{"id":"D","text":"amis"}],"answer":"B","id":"q1-6"},{"number":7,"theme":"Valeurs de la République","question":"Complétez les paroles de la Marseillaise : \"Allons enfants de la patrie […]\"","options":[{"id":"A","text":"le jour de gloire est arrivé"},{"id":"B","text":"vive la liberté"},{"id":"C","text":"marchons vers la paix"},{"id":"D","text":"chantons ensemble"}],"answer":"A","id":"q1-7"},{"number":8,"theme":"Valeurs de la République","question":"En application de la liberté individuelle, quelle proposition est correcte ? Une personne peut :","options":[{"id":"A","text":"Être obligée de suivre les autres"},{"id":"B","text":"Ne jamais choisir ses vêtements"},{"id":"C","text":"Faire tout ce qu’elle veut sans loi"},{"id":"D","text":"Se déplacer et s’habiller librement dans le respect de la loi"}],"answer":"D","id":"q1-8"},{"number":9,"theme":"Valeurs de la République","question":"Concernant la pratique de la religion, quelle proposition est correcte ?","options":[{"id":"A","text":"Elle est interdite en France"},{"id":"B","text":"Elle est obligatoire"},{"id":"C","text":"Elle est libre ou non, selon chacun"},{"id":"D","text":"Elle dépend de l’État"}],"answer":"C","id":"q1-9"},{"number":10,"theme":"Valeurs de la République","question":"En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l’école car ils sont mixtes ?","options":[{"id":"A","text":"Oui toujours"},{"id":"B","text":"Non sans raison valable prévue par la loi"},{"id":"C","text":"Oui pour toute raison religieuse"},{"id":"D","text":"Oui sans justification"}],"answer":"B","id":"q1-10"},{"number":11,"theme":"République et citoyenneté","question":"Quelle est la devise de la France ?","options":[{"id":"A","text":"Travail, Famille, Patrie"},{"id":"B","text":"Liberté, Union, Justice"},{"id":"C","text":"Liberté, Égalité, Fraternité"},{"id":"D","text":"Paix, Force, Honneur"}],"answer":"C","id":"q1-11"},{"number":12,"theme":"République et citoyenneté","question":"La répudiation de sa femme est :","options":[{"id":"A","text":"Autorisée partout"},{"id":"B","text":"Une tradition obligatoire"},{"id":"C","text":"Un droit en France"},{"id":"D","text":"Interdite et contraire aux droits fondamentaux"}],"answer":"D","id":"q1-12"},{"number":13,"theme":"République et citoyenneté","question":"Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?","options":[{"id":"A","text":"Les dépenses publiques"},{"id":"B","text":"Les jeux d’argent"},{"id":"C","text":"Les intérêts privés uniquement"},{"id":"D","text":"Les entreprises uniquement"}],"answer":"A","id":"q1-13"},{"number":14,"theme":"République et citoyenneté","question":"Peut-on brûler publiquement un drapeau français ?","options":[{"id":"A","text":"Oui toujours"},{"id":"B","text":"Oui dans tous les cas"},{"id":"C","text":"Non, c’est interdit dans ce contexte"},{"id":"D","text":"Oui comme un jeu"}],"answer":"C","id":"q1-14"},{"number":15,"theme":"République et citoyenneté","question":"Que fait l’État pour lutter contre les discriminations ? Il agit grâce :","options":[{"id":"A","text":"À l’absence de lois"},{"id":"B","text":"À des lois et des sanctions"},{"id":"C","text":"À l’interdiction de la justice"},{"id":"D","text":"À la suppression des droits"}],"answer":"B","id":"q1-15"},{"number":16,"theme":"République et citoyenneté","question":"Que représente Marianne ?","options":[{"id":"A","text":"Une députée réelle"},{"id":"B","text":"Une chanteuse célèbre"},{"id":"C","text":"La justice uniquement"},{"id":"D","text":"Le symbole de la République française"}],"answer":"D","id":"q1-16"},{"number":17,"theme":"République et citoyenneté","question":"Qu’est-ce que la liberté d’association ?","options":[{"id":"A","text":"L’interdiction de se regrouper"},{"id":"B","text":"Le droit de créer ou rejoindre une association librement"},{"id":"C","text":"Une obligation d’État"},{"id":"D","text":"Réservée aux entreprises"}],"answer":"B","id":"q1-17"},{"number":18,"theme":"République et citoyenneté","question":"Qu’est-ce que la liberté ?","options":[{"id":"A","text":"Faire uniquement ce que l’État impose"},{"id":"B","text":"Faire tout sans règle"},{"id":"C","text":"Faire ce que la loi interdit"},{"id":"D","text":"Faire ce que la loi permet"}],"answer":"D","id":"q1-18"},{"number":19,"theme":"République et citoyenneté","question":"Qu’est-ce que la Marseillaise ?","options":[{"id":"A","text":"Un film"},{"id":"B","text":"Une loi"},{"id":"C","text":"L’hymne national français"},{"id":"D","text":"Un drapeau"}],"answer":"C","id":"q1-19"},{"number":20,"theme":"République et citoyenneté","question":"Sur quel document peut-on voir Marianne ?","options":[{"id":"A","text":"Carte de crédit"},{"id":"B","text":"Timbres et documents officiels"},{"id":"C","text":"Factures privées"},{"id":"D","text":"Tickets de transport uniquement"}],"answer":"B","id":"q1-20"},{"number":21,"theme":"République et citoyenneté","question":"Un employeur refuse d’embaucher des femmes dans son entreprise. Que dit la loi ?","options":[{"id":"A","text":"C’est légal"},{"id":"B","text":"C’est recommandé"},{"id":"C","text":"C’est une obligation"},{"id":"D","text":"C’est une discrimination interdite"}],"answer":"D","id":"q1-21"},{"number":22,"theme":"République et citoyenneté","question":"Une des valeurs de la devise républicaine est l’égalité. Qu’est-ce que cela signifie ?","options":[{"id":"A","text":"Donner plus de droits à certains"},{"id":"B","text":"Interdire les lois"},{"id":"C","text":"Traiter tout le monde de manière identique sans discrimination"},{"id":"D","text":"Favoriser un groupe"}],"answer":"C","id":"q1-22"},{"number":23,"theme":"République et citoyenneté","question":"Quelle est la place de la langue française dans la République ?","options":[{"id":"A","text":"Une langue secondaire"},{"id":"B","text":"Interdite dans certains cas"},{"id":"C","text":"La langue officielle de la République"},{"id":"D","text":"Facultative dans l’administration"}],"answer":"C","id":"q1-23"},{"number":24,"theme":"République et citoyenneté","question":"Quels sont des symboles officiels de la République française ?","options":[{"id":"A","text":"Pizza, Tour Eiffel, croissant"},{"id":"B","text":"Drapeau, devise, Marianne, Marseillaise"},{"id":"C","text":"Internet et télévision"},{"id":"D","text":"École et université uniquement"}],"answer":"B","id":"q1-24"},{"number":25,"theme":"République et citoyenneté","question":"A-t-on le droit d’insulter publiquement quelqu’un parce qu’il est différent (handicap, apparence physique, sexe…) ?","options":[{"id":"A","text":"Oui librement"},{"id":"B","text":"Oui sur internet"},{"id":"C","text":"Oui si on est en colère"},{"id":"D","text":"Non, c’est interdit"}],"answer":"D","id":"q1-25"},{"number":26,"theme":"République et citoyenneté","question":"Le régime de la France est :","options":[{"id":"A","text":"Une monarchie"},{"id":"B","text":"Une dictature"},{"id":"C","text":"Une république démocratique et laïque"},{"id":"D","text":"Un empire"}],"answer":"C","id":"q1-26"},{"number":27,"theme":"Laïcité et liberté de conscience","question":"Pourquoi le principe de laïcité doit-il être respecté à l’école ?","options":[{"id":"A","text":"Pour favoriser une religion"},{"id":"B","text":"Pour éviter les conflits et garantir la neutralité"},{"id":"C","text":"Pour imposer une croyance"},{"id":"D","text":"Pour supprimer les religions"}],"answer":"B","id":"q1-27"},{"number":28,"theme":"Laïcité et liberté de conscience","question":"En quelle année la loi de séparation des Églises et de l’Etat a-t-elle été votée ?","options":[{"id":"A","text":"1945"},{"id":"B","text":"1958"},{"id":"C","text":"1881"},{"id":"D","text":"1905"}],"answer":"D","id":"q1-28"},{"number":29,"theme":"Laïcité et liberté de conscience","question":"Une personne a-t-elle le droit de ne pas croire en une religion ?","options":[{"id":"A","text":"Non"},{"id":"B","text":"Oui, liberté de conscience"},{"id":"C","text":"Seulement sur autorisation"},{"id":"D","text":"Seulement en France"}],"answer":"B","id":"q1-29"},{"number":30,"theme":"Laïcité et liberté de conscience","question":"Quel droit est garanti par la laïcité ?","options":[{"id":"A","text":"L’interdiction des religions"},{"id":"B","text":"Une religion officielle"},{"id":"C","text":"La liberté de croire ou ne pas croire"},{"id":"D","text":"Le contrôle religieux de l’État"}],"answer":"C","id":"q1-30"},{"number":31,"theme":"Laïcité et liberté de conscience","question":"À l’école publique, qui peut porter des signes religieux très visibles ?","options":[{"id":"A","text":"Personne"},{"id":"B","text":"Uniquement les enseignants"},{"id":"C","text":"Tout le monde sans limite"},{"id":"D","text":"Les élèves selon la loi en vigueur (interdiction des signes ostentatoires)"}],"answer":"D","id":"q1-31"},{"number":32,"theme":"Laïcité et liberté de conscience","question":"Selon le principe de laïcité, que signifie la neutralité de l’État ?","options":[{"id":"A","text":"Favoriser une religion"},{"id":"B","text":"Être contre toutes les religions"},{"id":"C","text":"Ne favoriser aucune religion"},{"id":"D","text":"Imposer une croyance"}],"answer":"C","id":"q1-32"},{"number":33,"theme":"Laïcité et liberté de conscience","question":"Que peut faire un usager du service public dans une mairie ?","options":[{"id":"A","text":"Recevoir des services publics"},{"id":"B","text":"Diriger la mairie"},{"id":"C","text":"Créer des lois"},{"id":"D","text":"Juger des citoyens"}],"answer":"A","id":"q1-33"},{"number":34,"theme":"Laïcité et liberté de conscience","question":"Qui doit respecter le principe de neutralité religieuse dans une préfecture ?","options":[{"id":"A","text":"Les visiteurs"},{"id":"B","text":"Les agents publics"},{"id":"C","text":"Les touristes"},{"id":"D","text":"Les entreprises privées"}],"answer":"B","id":"q1-34"},{"number":35,"theme":"Laïcité et liberté de conscience","question":"La laïcité impose-t-elle aux agents publics d’être neutres vis-à-vis des usagers ?","options":[{"id":"A","text":"Oui, toujours"},{"id":"B","text":"Non jamais"},{"id":"C","text":"Seulement parfois"},{"id":"D","text":"Uniquement à leur choix"}],"answer":"A","id":"q1-35"},{"number":36,"theme":"Laïcité et liberté de conscience","question":"Que garantit le principe de laïcité ?","options":[{"id":"A","text":"Une religion obligatoire"},{"id":"B","text":"La liberté de conscience et l’égalité"},{"id":"C","text":"L’interdiction de penser"},{"id":"D","text":"La suppression des droits"}],"answer":"B","id":"q1-36"},{"number":37,"theme":"Laïcité et liberté de conscience","question":"A-t-on le droit de changer de religion ?","options":[{"id":"A","text":"Non"},{"id":"B","text":"Oui"},{"id":"C","text":"Seulement une fois"},{"id":"D","text":"Seulement dans certains pays"}],"answer":"B","id":"q1-37"},{"number":38,"theme":"Laïcité et liberté de conscience","question":"Que représente la laïcité ?","options":[{"id":"A","text":"Une religion d’État"},{"id":"B","text":"La séparation des religions et de l’État"},{"id":"C","text":"Une obligation religieuse"},{"id":"D","text":"Une interdiction des croyances"}],"answer":"B","id":"q1-38"},{"number":39,"theme":"Laïcité et liberté de conscience","question":"Qu’est ce qui est interdit par la Charte de la laïcité à l’école ?","options":[{"id":"A","text":"Apprendre à lire"},{"id":"B","text":"Les loisirs scolaires"},{"id":"C","text":"Le respect des règles"},{"id":"D","text":"Le prosélytisme et les signes religieux ostentatoires à l’école"}],"answer":"D","id":"q1-39"},{"number":40,"theme":"Laïcité et liberté de conscience","question":"Que dit l’article 1er de la Constitution française ? La France est :","op ":"D","text":"Intervenir dans les cours sans autorisation"}],"answer":"D","id":"q5-28"},{"number":29,"theme":"École et éducation","question":"Quel motif d’absence est accepté par l’école ?","options":[{"id":"A","text":"Vacances non autorisées"},{"id":"B","text":"Journée shopping"},{"id":"C","text":"Sport sans justification"},{"id":"D","text":"Maladie avec justificatif"}],"answer":"D","id":"q5-29"},{"number":30,"theme":"École et éducation","question":"Des parents ne respectent pas l’obligation d’instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?","options":[{"id":"A","text":"Aucun risque"},{"id":"B","text":"Félicitation"},{"id":"C","text":"Prime"},{"id":"D","text":"Amende et sanctions possibles"}],"answer":"D","id":"q5-30"},{"number":31,"theme":"École et éducation","question":"Quand ont lieu les vacances scolaires de Noël ?","options":[{"id":"A","text":"Juin"},{"id":"B","text":"Septembre"},{"id":"C","text":"Avril"},{"id":"D","text":"Décembre"}],"answer":"D","id":"q5-31"},{"number":32,"theme":"École et éducation","question":"Élève en situation de handicap :","options":[{"id":"A","text":"Exclu de l’école"},{"id":"B","text":"École interdite"},{"id":"C","text":"École réservée spéciale uniquement"},{"id":"D","text":"Accueilli et accompagné à l’école"}],"answer":"D","id":"q5-32"}]}]};
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ALL = DATA.quizzes.flatMap(z => z.questions.map(q => ({ ...q, quiz: z.id })));
const tkey = q => q.quiz + "|" + q.theme;
let S = null;               // état du quiz en cours
let prefs = { mode: "train", n: "all", off: new Set() }; // off = thèmes décochés

/* ---------- Accueil ---------- */
function home() {
  S = null;
  const count = k => ALL.filter(q => tkey(q) === k).length;
  const groups = DATA.quizzes.map(z => `
    <fieldset><legend>${esc(z.title)}</legend>
      ${z.themes.map(t => { const k = z.id + "|" + t; return `
      <label><input type="checkbox" data-k="${esc(k)}" ${prefs.off.has(k) ? "" : "checked"}>
        <span>${esc(t)}</span><span class="count">${count(k)}</span></label>`; }).join("")}
    </fieldset>`).join("");
  app.innerHTML = `
    ${nav("home")}
    <h1>Entraînement à l'examen civique</h1>
    <p class="sub">${DATA.total} questions. Choisis tes thèmes, puis lance une série.</p>
    <div class="mini">
      <button class="link" id="all">Tout cocher</button><button class="link" id="none">Tout décocher</button>
    </div>
    ${groups}
    <div class="row">
      <fieldset><legend>Mode</legend>
        <label><input type="radio" name="mode" value="train" ${prefs.mode === "train" ? "checked" : ""}><span>Entraînement : correction après chaque question</span></label>
        <label><input type="radio" name="mode" value="exam" ${prefs.mode === "exam" ? "checked" : ""}><span>Examen : correction à la fin</span></label>
      </fieldset>
      <fieldset><legend>Nombre de questions</legend>
        <select id="n">${["10", "20", "40", "all"].map(v => `<option value="${v}" ${prefs.n === v ? "selected" : ""}>${v === "all" ? "Toutes" : v}</option>`).join("")}</select>
      </fieldset>
    </div>
    <button class="btn" id="go"></button>`;
  const refresh = () => {
    prefs.off = new Set([...app.querySelectorAll("[data-k]")].filter(c => !c.checked).map(c => c.dataset.k));
    prefs.mode = app.querySelector("[name=mode]:checked").value;
    prefs.n = $("#n").value;
    const pool = ALL.filter(q => !prefs.off.has(tkey(q))).length;
    const k = prefs.n === "all" ? pool : Math.min(+prefs.n, pool);
    $("#go").textContent = pool ? `Commencer (${k} question${k > 1 ? "s" : ""})` : "Choisis au moins un thème";
    $("#go").disabled = !pool;
  };
  app.onchange = refresh;
  $("#all").onclick = () => { app.querySelectorAll("[data-k]").forEach(c => c.checked = true); refresh(); };
  $("#none").onclick = () => { app.querySelectorAll("[data-k]").forEach(c => c.checked = false); refresh(); };
  bindNav();
  $("#go").onclick = () => start(ALL.filter(q => !prefs.off.has(tkey(q))), prefs.n);
  refresh();
}

/* ---------- Quiz ---------- */
function start(pool, n) {
  let qs = shuffle(pool);
  if (n !== "all") qs = qs.slice(0, +n);
  qs = qs.map(q => ({ ...q, options: shuffle(q.options) })); // les ids restent liés à la bonne réponse
  S = { qs, i: 0, picks: [], mode: prefs.mode, locked: false };
  question();
}

function question() {
  const q = S.qs[S.i], total = S.qs.length, train = S.mode === "train";
  app.innerHTML = `
    <div class="meta"><span>Question ${S.i + 1} / ${total}</span><span>${esc(q.theme)}</span></div>
    <div class="bar"><i style="width:${(S.i / total) * 100}%"></i></div>
    <h2>${esc(q.question)}</h2>
    <div id="opts">${q.options.map((o, k) => `
      <button class="opt" data-id="${o.id}"><b>${"ABCD"[k]}</b><span>${esc(o.text)}</span></button>`).join("")}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn" id="next" disabled>${S.i + 1 === total ? "Voir le résultat" : "Question suivante"}</button>
      <button class="btn ghost" id="quit">Abandonner</button></div>`;
  S.locked = false; S.cur = null;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b.dataset.id));
  $("#next").onclick = next;
  $("#quit").onclick = () => confirm("Abandonner cette série ?") && home();
}

function pick(id) {
  if (S.locked) return;
  const q = S.qs[S.i], train = S.mode === "train";
  S.cur = id;
  const btns = app.querySelectorAll(".opt");
  if (train) {
    S.locked = true;
    const good = id === q.answer;
    btns.forEach(b => { b.disabled = true; if (b.dataset.id === q.answer) b.classList.add("ok"); else if (b.dataset.id === id) b.classList.add("ko"); });
    const fb = $("#fb");
    fb.className = "fb " + (good ? "ok" : "ko");
    fb.textContent = good ? "Bonne réponse." : "Mauvaise réponse. La bonne réponse est surlignée en vert.";
  } else {
    btns.forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  }
  $("#next").disabled = false;
  $("#next").focus();
}

function next() {
  if (S.cur == null) return;
  S.picks[S.i] = S.cur;
  if (++S.i < S.qs.length) question(); else result();
}

/* ---------- Résultat ---------- */
function result() {
  record();
  const total = S.qs.length;
  const wrong = S.qs.filter((q, i) => S.picks[i] !== q.answer);
  const good = total - wrong.length, pct = Math.round(good / total * 100);
  const txt = (q, id) => esc((q.options.find(o => o.id === id) || {}).text || "");
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="score">${good} / ${total}</div>
    <p class="sub">${pct} % de bonnes réponses.${wrong.length ? "" : " Aucune erreur, bravo."}</p>
    ${wrong.length ? `<h2>À revoir (${wrong.length})</h2>` : ""}
    ${wrong.map(q => `<div class="err"><p><strong>${esc(q.question)}</strong></p>
      <p class="bad">Ta réponse : ${txt(q, S.picks[S.qs.indexOf(q)])}</p>
      <p class="good">Bonne réponse : ${txt(q, q.answer)}</p></div>`).join("")}
    <div class="actions">
      ${wrong.length ? `<button class="btn" id="redo">Refaire mes erreurs</button>` : ""}
      <button class="btn ${wrong.length ? "ghost" : ""}" id="home">Nouvelle série</button>
      <button class="btn ghost" id="hist">Voir mon historique</button></div>`;
  $("#home").onclick = home;
  $("#hist").onclick = () => showHistory();
  if (wrong.length) $("#redo").onclick = () => start(wrong.map(({ options, ...q }) => ALL.find(a => a.id === q.id)), "all");
}

/* ---------- Historique : stockage local, import / export ---------- */
const KEY = "civique.history.v1";
let HIST = [];
try { HIST = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { HIST = []; }
const saveHist = () => { try { localStorage.setItem(KEY, JSON.stringify(HIST)); } catch (e) {} };
const byDate = (a, b) => Date.parse(a.date) - Date.parse(b.date);
const fmt = (iso, full) => new Date(iso).toLocaleString("fr-FR", full ? { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "short" });
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const MODE = m => m === "exam" ? "Examen" : "Entraînement";
const nav = on => `<nav class="tabs"><button data-go="home" class="${on === "home" ? "on" : ""}">Quiz</button><button data-go="hist" class="${on === "hist" ? "on" : ""}">Historique (${HIST.length})</button></nav>`;
const bindNav = () => app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "home" ? home() : showHistory());

function record() {
  if (S.saved) return; S.saved = true;
  const themes = {};
  S.qs.forEach((q, i) => { const t = themes[tkey(q)] ||= [0, 0]; t[1]++; if (S.picks[i] === q.answer) t[0]++; });
  const good = Object.values(themes).reduce((n, t) => n + t[0], 0);
  HIST.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: new Date().toISOString(), mode: S.mode, total: S.qs.length, good, themes });
  saveHist();
}

/* Points forts / faibles : thèmes (≥ 3 réponses cumulées) classés par réussite ; moitié haute = forts, moitié basse = faibles */
function analyse() {
  const sessions = HIST.slice().sort(byDate), agg = {};
  sessions.forEach(s => Object.entries(s.themes).forEach(([k, [ok, n]]) => { const a = agg[k] ||= [0, 0]; a[0] += ok; a[1] += n; }));
  const list = Object.entries(agg).filter(([, a]) => a[1] >= 3)
    .map(([k, a]) => ({ k, label: k.split("|")[1] || k, rate: a[0] / a[1], ok: a[0], n: a[1] })).sort((x, y) => y.rate - x.rate);
  const ok = list.length >= 2, h = Math.ceil(list.length / 2);
  const strong = ok ? list.slice(0, h) : [], weak = ok ? list.slice(h) : [];
  const grp = arr => { const n = arr.reduce((a, t) => a + t.n, 0); return n ? Math.round(arr.reduce((a, t) => a + t.ok, 0) / n * 100) : null; };
  const group = {}; strong.forEach(t => group[t.k] = "s"); weak.forEach(t => group[t.k] = "w");
  const keys = [...strong.map(t => t.k), ...weak.map(t => t.k), ...Object.keys(agg).filter(k => !group[k])];
  const dark = !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const fam = { s: [130, 250], w: [300, 420], o: [220, 220] };   // teintes : forts = verts→bleus, faibles = magenta→rouge→jaune
  const cnt = { s: strong.length, w: weak.length, o: keys.length - strong.length - weak.length }, seen = { s: 0, w: 0, o: 0 };
  const themes = keys.map(k => {
    const g = group[k] || "o", i = seen[g]++, u = cnt[g] > 1 ? i / (cnt[g] - 1) : 0.5;
    const hue = Math.round((fam[g][0] + u * (fam[g][1] - fam[g][0])) % 360), light = (dark ? 64 : 42) + (i % 2 ? (dark ? -9 : 11) : 0);
    const pts = [];
    sessions.forEach((s, si) => { const v = s.themes[k]; if (v && v[1] > 0) pts.push({ i: si, v: v[0] / v[1] * 100, ok: v[0], n: v[1] }); });
    return { k, label: k.split("|")[1] || k, g, pts, color: g === "o" ? `hsl(220 10% ${dark ? 62 : 48}%)` : `hsl(${hue} 72% ${light}%)` };
  });
  return { ok, strong, weak, themes, sessions: sessions.map((s, i) => ({ i, date: s.date, total: pct(s.good, s.total) })), gs: grp(strong), gw: grp(weak) };
}

/* Courbe lissée (Catmull-Rom → Bézier), bornée à la zone du graphique */
function curve(p, lo, hi) {
  const cl = y => Math.max(lo, Math.min(hi, y)), f = v => v.toFixed(1);
  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += `C${f(b[0] + (c[0] - a[0]) / 6)},${f(cl(b[1] + (c[1] - a[1]) / 6))} ${f(c[0] - (e[0] - b[0]) / 6)},${f(cl(c[1] - (e[1] - b[1]) / 6))} ${f(c[0])},${f(c[1])}`;
  }
  return d;
}

/* Graphique : une courbe par thème, un point par série où le thème a réellement été travaillé */
const view = { f: "all", off: new Set() };   // filtre (tous / forts / faibles) + thèmes masqués à la main

function paintChart(A) {
  const host = $("#chartCard");
  if (!HIST.length) { host.innerHTML = `<p class="mute" style="margin:6px 8px">Termine une série pour voir ta progression ici.</p>`; return; }
  const inGroup = A.themes.filter(t => view.f === "all" || t.g === view.f);
  const vis = inGroup.filter(t => !view.off.has(t.k));
  const W = 640, H = 340, m = { l: 44, r: 18, t: 16, b: 34 }, iw = W - m.l - m.r, ih = H - m.t - m.b, n = A.sessions.length;
  const X = i => n === 1 ? m.l + iw / 2 : m.l + iw * i / (n - 1), Y = v => m.t + ih * (1 - v / 100);
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="g" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v} %</text>`).join("");
  const step = Math.max(1, Math.ceil(n / 6));
  const xl = A.sessions.filter(p => p.i % step === 0).map(p => `<text class="ax" x="${X(p.i)}" y="${H - 10}" text-anchor="middle">${fmt(p.date)}</text>`).join("");
  const lines = vis.map(t => {
    const p = t.pts.map(d => [X(d.i), Y(d.v)]);
    return `<g class="tl" data-k="${esc(t.k)}" style="--c:${t.color}">${p.length > 1 ? `<path class="ln" pathLength="1" d="${curve(p, m.t, m.t + ih)}"/>` : ""}${p.map(([x, y]) => `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>`).join("")}</g>`;
  }).join("");
  const fb = (f, cls, label) => `<button class="chip ${cls} ${view.f === f ? "on" : ""}" data-f="${f}" ${f !== "all" && !A.ok ? "disabled" : ""}>${label}</button>`;
  host.innerHTML = `
    <div class="legend">${fb("all", "a", "Tous les thèmes")}${fb("s", "s", `Points forts · ${A.gs ?? "—"} %`)}${fb("w", "w", `Points faibles · ${A.gw ?? "—"} %`)}</div>
    <div class="wrap"><svg id="cs" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score par thème, série après série">
      ${grid}${xl}${lines}${vis.length ? "" : `<text class="ax" x="${W / 2}" y="${H / 2}" text-anchor="middle">Aucun thème affiché</text>`}
      <line id="gd" class="gd" y1="${m.t}" y2="${m.t + ih}"/><g id="hv"></g></svg><div class="tip" id="tip" hidden></div></div>
    <div class="lgs">${inGroup.map(t => `<button class="lg ${view.off.has(t.k) ? "off" : ""}" data-k="${esc(t.k)}" style="--c:${t.color}" aria-pressed="${!view.off.has(t.k)}">${esc(t.label)}</button>`).join("")}</div>
    <p class="hint">Un point = un thème réellement travaillé dans la série. Clique sur un thème pour le masquer ou l'afficher, survole-le pour le mettre en avant.</p>`;

  const svg = $("#cs"), tip = $("#tip"), gd = $("#gd"), hv = $("#hv");
  host.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { view.f = b.dataset.f; view.off.clear(); paintChart(A); });
  const hi = k => { svg.classList.toggle("fx", k != null); svg.querySelectorAll(".tl").forEach(g => g.classList.toggle("on", g.dataset.k === k)); };
  host.querySelectorAll(".lg").forEach(b => {
    b.onclick = () => { const k = b.dataset.k; view.off.has(k) ? view.off.delete(k) : view.off.add(k); paintChart(A); };
    b.onmouseenter = b.onfocus = () => hi(b.dataset.k);
    b.onmouseleave = b.onblur = () => hi(null);
  });
  const move = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((vx - m.l) / iw * (n - 1)))), d = A.sessions[i], x = X(i);
    const rows = vis.map(t => [t, t.pts.find(p => p.i === i)]).filter(r => r[1]).sort((a, b) => b[1].v - a[1].v);
    gd.setAttribute("x1", x); gd.setAttribute("x2", x); gd.style.opacity = 1;
    hv.innerHTML = rows.map(([t, p]) => `<circle class="hl" style="--c:${t.color}" cx="${x}" cy="${Y(p.v)}" r="8"/>`).join("");
    tip.hidden = false;
    tip.innerHTML = `<strong>${fmt(d.date, true)} · série à ${d.total} %</strong>` + (rows.length
      ? rows.map(([t, p]) => `<span style="--c:${t.color}"><i>${esc(t.label)}</i><b>${Math.round(p.v)} % (${p.ok}/${p.n})</b></span>`).join("")
      : `<span style="--c:transparent"><i>Aucun thème affiché sur cette série</i></span>`);
    const half = tip.offsetWidth / 2 + 4;
    tip.style.left = Math.min(Math.max(x / W * r.width, half), r.width - half) + "px";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; gd.style.opacity = 0; hv.innerHTML = ""; });
}

function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0, 10);
const exportJSON = () => download(`historique_civique_${today()}.json`, JSON.stringify({ app: "entrainement-civique", version: 1, exported: new Date().toISOString(), sessions: HIST }, null, 2), "application/json");
const exportCSV = () => download(`historique_civique_${today()}.csv`, "\ufeff" + ["date;mode;questions;bonnes;pourcentage"].concat(HIST.slice().sort(byDate).map(s => [s.date, MODE(s.mode), s.total, s.good, pct(s.good, s.total)].join(";"))).join("\n"), "text/csv");

function importFile(file) {
  const r = new FileReader();
  r.onerror = () => showHistory("Impossible de lire ce fichier.", true);
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), arr = Array.isArray(j) ? j : j.sessions;
      if (!Array.isArray(arr)) throw 0;
      const ids = new Set(HIST.map(s => s.id)); let add = 0, skip = 0;
      arr.forEach(s => {
        const ok = s && s.id != null && !isNaN(Date.parse(s.date)) && s.total > 0 && s.good >= 0 && s.good <= s.total && s.themes && typeof s.themes === "object"
          && Object.values(s.themes).every(v => Array.isArray(v) && v.length === 2 && v.every(Number.isFinite));
        if (!ok || ids.has(String(s.id))) { skip++; return; }
        HIST.push({ id: String(s.id), date: new Date(s.date).toISOString(), mode: s.mode === "exam" ? "exam" : "train", total: +s.total, good: +s.good, themes: s.themes });
        ids.add(String(s.id)); add++;
      });
      HIST.sort(byDate); saveHist();
      showHistory(`${add} série${add > 1 ? "s" : ""} importée${add > 1 ? "s" : ""}${skip ? `, ${skip} ignorée${skip > 1 ? "s" : ""} (doublon ou format invalide)` : ""}.`);
    } catch (e) { showHistory("Fichier invalide : choisis un export JSON de cette application.", true); }
  };
  r.readAsText(file);
}

function showHistory(note, bad) {
  S = null; app.onchange = null;
  const A = analyse(), n = HIST.length;
  const rates = HIST.map(s => pct(s.good, s.total));
  const col = (c, title, arr) => `<div class="col ${c}"><h3>${title}</h3>${arr.length ? arr.map(t => `<p><span>${esc(t.label)}</span><b>${Math.round(t.rate * 100)} %</b></p>`).join("") : `<p class="mute">—</p>`}</div>`;
  const rows = HIST.slice().sort((a, b) => byDate(b, a)).map(s => { const p = pct(s.good, s.total); return `<tr><td>${fmt(s.date, true)}</td><td>${MODE(s.mode)}</td><td>${s.good} / ${s.total}</td><td><span class="pill ${p >= 75 ? "hi" : p < 50 ? "lo" : ""}">${p} %</span></td></tr>`; }).join("");
  app.innerHTML = `${nav("hist")}
    <h1>Mon historique</h1>
    ${note ? `<p class="note ${bad ? "bad" : ""}" role="status">${esc(note)}</p>` : ""}
    <div class="cards">
      <div><b>${n}</b><span>séries</span></div>
      <div><b>${n ? Math.round(rates.reduce((a, b) => a + b, 0) / n) : 0} %</b><span>moyenne</span></div>
      <div><b>${n ? Math.max(...rates) : 0} %</b><span>meilleur score</span></div>
      <div><b>${HIST.reduce((a, s) => a + s.total, 0)}</b><span>questions</span></div></div>
    <section class="card" id="chartCard"></section>
    ${A.ok ? `<div class="cols">${col("s", "Points forts", A.strong)}${col("w", "Points faibles", A.weak)}</div>` : ""}
    ${n ? `<div class="tbl"><table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Résultat</th></tr></thead><tbody>${rows}</tbody></table></div>` : ""}
    <div class="actions">
      <button class="btn" id="ex" ${n ? "" : "disabled"}>Exporter (JSON)</button>
      <button class="btn ghost" id="exc" ${n ? "" : "disabled"}>Exporter (CSV)</button>
      <button class="btn ghost" id="im">Importer…</button>
      <button class="btn ghost" id="clr" ${n ? "" : "disabled"}>Effacer</button>
      <input type="file" id="imf" accept=".json,application/json" hidden></div>`;
  bindNav(); paintChart(A);
  $("#ex").onclick = exportJSON; $("#exc").onclick = exportCSV;
  $("#im").onclick = () => $("#imf").click();
  $("#imf").onchange = e => e.target.files[0] && importFile(e.target.files[0]);
  $("#clr").onclick = () => { if (confirm("Effacer tout l'historique ? Pense à l'exporter avant.")) { HIST = []; saveHist(); showHistory("Historique effacé."); } };
}

/* ---------- Clavier : A-D ou 1-4 pour répondre, Entrée pour continuer ---------- */
document.addEventListener("keydown", e => {
  if (!S || !app.querySelector(".opt") || e.ctrlKey || e.metaKey) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) { const b = app.querySelectorAll(".opt")[k % 4]; if (b && !b.disabled) pick(b.dataset.id); }
  else if (e.key === "Enter" && !$("#next").disabled && document.activeElement.tagName !== "BUTTON") next();
});

home();
</script>

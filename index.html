<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement à l'examen civique</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#16213a;--mute:#5d6783;--line:#d9deea;--accent:#1f3f9e;--accent-ink:#fff;--ok:#16794a;--okbg:#e4f5ec;--ko:#b3261e;--kobg:#fbe9e7;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1526;--card:#171f36;--ink:#e8ecf7;--mute:#9aa5c4;--line:#2b3556;--accent:#6f93ff;--accent-ink:#0f1526;--ok:#5fd29a;--okbg:#12302a;--ko:#ff8a80;--kobg:#3a1c1f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:700 1.3rem/1.35 Georgia,"Times New Roman",serif;margin:0 0 16px}
p.sub{color:var(--mute);margin:0 0 20px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:0 0 12px;padding:10px 14px 12px}
legend{font-weight:600;padding:0 6px}
label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
input[type=checkbox],input[type=radio]{margin-top:5px;accent-color:var(--accent)}
.count{color:var(--mute);white-space:nowrap;margin-left:auto;padding-left:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.row>fieldset{flex:1 1 240px;margin:0}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.mini{display:flex;gap:8px;margin:0 0 12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:12px 20px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.link{background:none;border:0;color:var(--accent);padding:2px 4px;text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.fb{min-height:1.6em;font-weight:600;margin:4px 0 14px}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.score{font:700 3rem/1 Georgia,serif;margin:8px 0}
.err{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ko);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.err p{margin:2px 0}.bad{color:var(--ko)}.good{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"title":"Questions civiques","total":209,"quizzes":[{"id":1,"title":"Valeurs de la République, Citoyenneté et Laïcité","themes":["Valeurs de la République","République et citoyenneté","Laïcité et liberté de conscience"],"count":40,"questions":[{"number":1,"theme":"Valeurs de la République","question":"Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?","options":[{"id":"A","text":"Ignorer les élections"},{"id":"B","text":"Voter aux élections"},{"id":"C","text":"Refuser de s’inscrire sur les listes électorales"},{"id":"D","text":"Ne pas lire les programmes politiques"}],"answer":"B","id":"q1-1"},{"number":2,"theme":"Valeurs de la République","question":"Que garantit la liberté d’expression ?","options":[{"id":"A","text":"Le droit de tout imposer sans limites"},{"id":"B","text":"Le droit de censurer les autres"},{"id":"C","text":"Le droit de dire uniquement la vérité officielle"},{"id":"D","text":"Le droit d’exprimer ses opinions dans le respect de la loi"}],"answer":"D","id":"q1-2"},{"number":3,"theme":"Valeurs de la République","question":"À quoi sert un titre de séjour ?","options":[{"id":"A","text":"À prouver la nationalité française"},{"id":"B","text":"À autoriser un étranger à séjourner légalement en France"},{"id":"C","text":"À voter aux élections présidentielles"},{"id":"D","text":"À obtenir automatiquement un emploi"}],"answer":"B","id":"q1-3"},{"number":4,"theme":"Valeurs de la République","question":"La liberté de circulation permet à toute personne de :","options":[{"id":"A","text":"Voyager librement dans les limites de la loi"},{"id":"B","text":"Rester uniquement dans son pays de naissance"},{"id":"C","text":"Être obligée de rester dans sa région"},{"id":"D","text":"Voyager uniquement avec autorisation policière"}],"answer":"A","id":"q1-4"},{"number":5,"theme":"Valeurs de la République","question":"Sur quel site internet peut-on retrouver le symbole de la République française ?","options":[{"id":"A","text":"wikipedia.org"},{"id":"B","text":"elysee.fr"},{"id":"C","text":"amazon.fr"},{"id":"D","text":"netflix.com"}],"answer":"B","id":"q1-5"},{"number":6,"theme":"Valeurs de la République","question":"Complétez la Marseillaise : \"Aux armes […] !\"","options":[{"id":"A","text":"soldats"},{"id":"B","text":"citoyens"},{"id":"C","text":"français uniquement"},{"id":"D","text":"amis"}],"answer":"B","id":"q1-6"},{"number":7,"theme":"Valeurs de la République","question":"Complétez la Marseillaise : \"Allons enfants de la patrie […]\"","options":[{"id":"A","text":"le jour de gloire est arrivé"},{"id":"B","text":"vive la liberté"},{"id":"C","text":"marchons vers la paix"},{"id":"D","text":"chantons ensemble"}],"answer":"A","id":"q1-7"},{"number":8,"theme":"Valeurs de la République","question":"En application de la liberté individuelle, une personne peut :","options":[{"id":"A","text":"Être obligée de suivre les autres"},{"id":"B","text":"Ne jamais choisir ses vêtements"},{"id":"C","text":"Faire tout ce qu’elle veut sans loi"},{"id":"D","text":"Se déplacer et s’habiller librement dans le respect de la loi"}],"answer":"D","id":"q1-8"},{"number":9,"theme":"Valeurs de la République","question":"Concernant la pratique de la religion :","options":[{"id":"A","text":"Elle est interdite en France"},{"id":"B","text":"Elle est obligatoire"},{"id":"C","text":"Elle est libre ou non, selon chacun"},{"id":"D","text":"Elle dépend de l’État"}],"answer":"C","id":"q1-9"},{"number":10,"theme":"Valeurs de la République","question":"Un parent peut-il refuser le sport mixte à l’école ?","options":[{"id":"A","text":"Oui toujours"},{"id":"B","text":"Non sans raison valable prévue par la loi"},{"id":"C","text":"Oui pour toute raison religieuse"},{"id":"D","text":"Oui sans justification"}],"answer":"B","id":"q1-10"},{"number":11,"theme":"République et citoyenneté","question":"Quelle est la devise de la France ?","options":[{"id":"A","text":"Travail, Famille, Patrie"},{"id":"B","text":"Liberté, Union, Justice"},{"id":"C","text":"Liberté, Égalité, Fraternité"},{"id":"D","text":"Paix, Force, Honneur"}],"answer":"C","id":"q1-11"},{"number":12,"theme":"République et citoyenneté","question":"La répudiation de sa femme est :","options":[{"id":"A","text":"Autorisée partout"},{"id":"B","text":"Une tradition obligatoire"},{"id":"C","text":"Un droit en France"},{"id":"D","text":"Interdite et contraire aux droits fondamentaux"}],"answer":"D","id":"q1-12"},{"number":13,"theme":"République et citoyenneté","question":"Les impôts permettent de financer :","options":[{"id":"A","text":"Les dépenses publiques"},{"id":"B","text":"Les jeux d’argent"},{"id":"C","text":"Les intérêts privés uniquement"},{"id":"D","text":"Les entreprises uniquement"}],"answer":"A","id":"q1-13"},{"number":14,"theme":"République et citoyenneté","question":"Peut-on brûler publiquement un drapeau français ?","options":[{"id":"A","text":"Oui toujours"},{"id":"B","text":"Oui dans tous les cas"},{"id":"C","text":"Non, c’est interdit dans ce contexte"},{"id":"D","text":"Oui comme un jeu"}],"answer":"C","id":"q1-14"},{"number":15,"theme":"République et citoyenneté","question":"L’État lutte contre les discriminations grâce :","options":[{"id":"A","text":"À l’absence de lois"},{"id":"B","text":"À des lois et des sanctions"},{"id":"C","text":"À l’interdiction de la justice"},{"id":"D","text":"À la suppression des droits"}],"answer":"B","id":"q1-15"},{"number":16,"theme":"République et citoyenneté","question":"Que représente Marianne ?","options":[{"id":"A","text":"Une députée réelle"},{"id":"B","text":"Une chanteuse célèbre"},{"id":"C","text":"La justice uniquement"},{"id":"D","text":"Le symbole de la République française"}],"answer":"D","id":"q1-16"},{"number":17,"theme":"République et citoyenneté","question":"La liberté d’association est :","options":[{"id":"A","text":"L’interdiction de se regrouper"},{"id":"B","text":"Le droit de créer ou rejoindre une association librement"},{"id":"C","text":"Une obligation d’État"},{"id":"D","text":"Réservée aux entreprises"}],"answer":"B","id":"q1-17"},{"number":18,"theme":"République et citoyenneté","question":"Qu’est-ce que la liberté ?","options":[{"id":"A","text":"Faire uniquement ce que l’État impose"},{"id":"B","text":"Faire tout sans règle"},{"id":"C","text":"Faire ce que la loi interdit"},{"id":"D","text":"Faire ce que la loi permet"}],"answer":"D","id":"q1-18"},{"number":19,"theme":"République et citoyenneté","question":"La Marseillaise est :","options":[{"id":"A","text":"Un film"},{"id":"B","text":"Une loi"},{"id":"C","text":"L’hymne national français"},{"id":"D","text":"Un drapeau"}],"answer":"C","id":"q1-19"},{"number":20,"theme":"République et citoyenneté","question":"Sur quel document peut-on voir Marianne ?","options":[{"id":"A","text":"Carte de crédit"},{"id":"B","text":"Timbres et documents officiels"},{"id":"C","text":"Factures privées"},{"id":"D","text":"Tickets de transport uniquement"}],"answer":"B","id":"q1-20"},{"number":21,"theme":"République et citoyenneté","question":"Un employeur refuse les femmes :","options":[{"id":"A","text":"C’est légal"},{"id":"B","text":"C’est recommandé"},{"id":"C","text":"C’est une obligation"},{"id":"D","text":"C’est une discrimination interdite"}],"answer":"D","id":"q1-21"},{"number":22,"theme":"République et citoyenneté","question":"L’égalité signifie :","options":[{"id":"A","text":"Donner plus de droits à certains"},{"id":"B","text":"Interdire les lois"},{"id":"C","text":"Traiter tout le monde de manière identique sans discrimination"},{"id":"D","text":"Favoriser un groupe"}],"answer":"C","id":"q1-22"},{"number":23,"theme":"République et citoyenneté","question":"La langue française est :","options":[{"id":"A","text":"Une langue secondaire"},{"id":"B","text":"Interdite dans certains cas"},{"id":"C","text":"La langue officielle de la République"},{"id":"D","text":"Facultative dans l’administration"}],"answer":"C","id":"q1-23"},{"number":24,"theme":"République et citoyenneté","question":"Quels sont des symboles officiels de la République française ?","options":[{"id":"A","text":"Pizza, Tour Eiffel, croissant"},{"id":"B","text":"Drapeau, devise, Marianne, Marseillaise"},{"id":"C","text":"Internet et télévision"},{"id":"D","text":"École et université uniquement"}],"answer":"B","id":"q1-24"},{"number":25,"theme":"République et citoyenneté","question":"Peut-on insulter quelqu’un pour sa différence ?","options":[{"id":"A","text":"Oui librement"},{"id":"B","text":"Oui sur internet"},{"id":"C","text":"Oui si on est en colère"},{"id":"D","text":"Non, c’est interdit"}],"answer":"D","id":"q1-25"},{"number":26,"theme":"République et citoyenneté","question":"Le régime de la France est :","options":[{"id":"A","text":"Une monarchie"},{"id":"B","text":"Une dictature"},{"id":"C","text":"Une république démocratique et laïque"},{"id":"D","text":"Un empire"}],"answer":"C","id":"q1-26"},{"number":27,"theme":"Laïcité et liberté de conscience","question":"Pourquoi respecter la laïcité à l’école ?","options":[{"id":"A","text":"Pour favoriser une religion"},{"id":"B","text":"Pour éviter les conflits et garantir la neutralité"},{"id":"C","text":"Pour imposer une croyance"},{"id":"D","text":"Pour supprimer les religions"}],"answer":"B","id":"q1-27"},{"number":28,"theme":"Laïcité et liberté de conscience","question":"La loi de séparation des Églises et de l’État date de :","options":[{"id":"A","text":"1945"},{"id":"B","text":"1958"},{"id":"C","text":"1881"},{"id":"D","text":"1905"}],"answer":"D","id":"q1-28"},{"number":29,"theme":"Laïcité et liberté de conscience","question":"Une personne a-t-elle le droit de ne pas croire ?","options":[{"id":"A","text":"Non"},{"id":"B","text":"Oui, liberté de conscience"},{"id":"C","text":"Seulement sur autorisation"},{"id":"D","text":"Seulement en France"}],"answer":"B","id":"q1-29"},{"number":30,"theme":"Laïcité et liberté de conscience","question":"La laïcité garantit :","options":[{"id":"A","text":"L’interdiction des religions"},{"id":"B","text":"Une religion officielle"},{"id":"C","text":"La liberté de croire ou ne pas croire"},{"id":"D","text":"Le contrôle religieux de l’État"}],"answer":"C","id":"q1-30"},{"number":31,"theme":"Laïcité et liberté de conscience","question":"À l’école publique, qui peut porter des signes religieux visibles ?","options":[{"id":"A","text":"Personne"},{"id":"B","text":"Uniquement les enseignants"},{"id":"C","text":"Tout le monde sans limite"},{"id":"D","text":"Les élèves selon la loi en vigueur (interdiction des signes ostentatoires)"}],"answer":"D","id":"q1-31"},{"number":32,"theme":"Laïcité et liberté de conscience","question":"La neutralité de l’État signifie :","options":[{"id":"A","text":"Favoriser une religion"},{"id":"B","text":"Être contre toutes les religions"},{"id":"C","text":"Ne favoriser aucune religion"},{"id":"D","text":"Imposer une croyance"}],"answer":"C","id":"q1-32"},{"number":33,"theme":"Laïcité et liberté de conscience","question":"Un usager en mairie peut :","options":[{"id":"A","text":"Recevoir des services publics"},{"id":"B","text":"Diriger la mairie"},{"id":"C","text":"Créer des lois"},{"id":"D","text":"Juger des citoyens"}],"answer":"A","id":"q1-33"},{"number":34,"theme":"Laïcité et liberté de conscience","question":"Qui doit respecter la neutralité religieuse en préfecture ?","options":[{"id":"A","text":"Les visiteurs"},{"id":"B","text":"Les agents publics"},{"id":"C","text":"Les touristes"},{"id":"D","text":"Les entreprises privées"}],"answer":"B","id":"q1-34"},{"number":35,"theme":"Laïcité et liberté de conscience","question":"Les agents publics doivent être neutres :","options":[{"id":"A","text":"Oui, toujours"},{"id":"B","text":"Non jamais"},{"id":"C","text":"Seulement parfois"},{"id":"D","text":"Uniquement à leur choix"}],"answer":"A","id":"q1-35"},{"number":36,"theme":"Laïcité et liberté de conscience","question":"La laïcité garantit :","options":[{"id":"A","text":"Une religion obligatoire"},{"id":"B","text":"La liberté de conscience et l’égalité"},{"id":"C","text":"L’interdiction de penser"},{"id":"D","text":"La suppression des droits"}],"answer":"B","id":"q1-36"},{"number":37,"theme":"Laïcité et liberté de conscience","question":"A-t-on le droit de changer de religion ?","options":[{"id":"A","text":"Non"},{"id":"B","text":"Oui"},{"id":"C","text":"Seulement une fois"},{"id":"D","text":"Seulement dans certains pays"}],"answer":"B","id":"q1-37"},{"number":38,"theme":"Laïcité et liberté de conscience","question":"La laïcité représente :","options":[{"id":"A","text":"Une religion d’État"},{"id":"B","text":"La séparation des religions et de l’État"},{"id":"C","text":"Une obligation religieuse"},{"id":"D","text":"Une interdiction des croyances"}],"answer":"B","id":"q1-38"},{"number":39,"theme":"Laïcité et liberté de conscience","question":"La Charte de la laïcité interdit :","options":[{"id":"A","text":"Apprendre à lire"},{"id":"B","text":"Les loisirs scolaires"},{"id":"C","text":"Le respect des règles"},{"id":"D","text":"Le prosélytisme et les signes religieux ostentatoires à l’école"}],"answer":"D","id":"q1-39"},{"number":40,"theme":"Laïcité et liberté de conscience","question":"L’article 1er de la Constitution française dit que la France est :","options":[{"id":"A","text":"Une monarchie religieuse"},{"id":"B","text":"Une fédération religieuse"},{"id":"C","text":"Une dictature"},{"id":"D","text":"Une République indivisible, laïque, démocratique et sociale"}],"answer":"D","id":"q1-40"}]},{"id":2,"title":"Institutions françaises, Démocratie et Union européenne","themes":["État de droit et démocratie","Institutions françaises","Collectivités territoriales","Union européenne"],"count":50,"questions":[{"number":1,"theme":"État de droit et démocratie","question":"Qu'est-ce que l'État de droit ?","options":[{"id":"A","text":"L’État est au-dessus des citoyens et des lois"},{"id":"B","text":"Les lois ne s’appliquent qu’aux étrangers"},{"id":"C","text":"Le gouvernement peut décider sans règle"},{"id":"D","text":"T const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ALL = DATA.quizzes.flatMap(z => z.questions.map(q => ({ ...q, quiz: z.id })));
const tkey = q => q.quiz + "|" + q.theme;
let S = null;               // état du quiz en cours
let prefs = { mode: "train", n: "all", off: new Set() }; // off = thèmes décochés

/* ---------- Accueil ---------- */
function home() {
  S = null;
  const count = k => ALL.filter(q => tkey(q) === k).length;
  const groups = DATA.quizzes.map(z => `
    <fieldset><legend>${esc(z.title)}</legend>
      ${z.themes.map(t => { const k = z.id + "|" + t; return `
      <label><input type="checkbox" data-k="${esc(k)}" ${prefs.off.has(k) ? "" : "checked"}>
        <span>${esc(t)}</span><span class="count">${count(k)}</span></label>`; }).join("")}
    </fieldset>`).join("");
  app.innerHTML = `
    <h1>Entraînement à l'examen civique</h1>
    <p class="sub">${DATA.total} questions. Choisis tes thèmes, puis lance une série.</p>
    <div class="mini">
      <button class="link" id="all">Tout cocher</button><button class="link" id="none">Tout décocher</button>
    </div>
    ${groups}
    <div class="row">
      <fieldset><legend>Mode</legend>
        <label><input type="radio" name="mode" value="train" ${prefs.mode === "train" ? "checked" : ""}><span>Entraînement : correction après chaque question</span></label>
        <label><input type="radio" name="mode" value="exam" ${prefs.mode === "exam" ? "checked" : ""}><span>Examen : correction à la fin</span></label>
      </fieldset>
      <fieldset><legend>Nombre de questions</legend>
        <select id="n">${["10", "20", "40", "all"].map(v => `<option value="${v}" ${prefs.n === v ? "selected" : ""}>${v === "all" ? "Toutes" : v}</option>`).join("")}</select>
      </fieldset>
    </div>
    <button class="btn" id="go"></button>`;
  const refresh = () => {
    prefs.off = new Set([...app.querySelectorAll("[data-k]")].filter(c => !c.checked).map(c => c.dataset.k));
    prefs.mode = app.querySelector("[name=mode]:checked").value;
    prefs.n = $("#n").value;
    const pool = ALL.filter(q => !prefs.off.has(tkey(q))).length;
    const k = prefs.n === "all" ? pool : Math.min(+prefs.n, pool);
    $("#go").textContent = pool ? `Commencer (${k} question${k > 1 ? "s" : ""})` : "Choisis au moins un thème";
    $("#go").disabled = !pool;
  };
  app.onchange = refresh;
  $("#all").onclick = () => { app.querySelectorAll("[data-k]").forEach(c => c.checked = true); refresh(); };
  $("#none").onclick = () => { app.querySelectorAll("[data-k]").forEach(c => c.checked = false); refresh(); };
  $("#go").onclick = () => start(ALL.filter(q => !prefs.off.has(tkey(q))), prefs.n);
  refresh();
}

/* ---------- Quiz ---------- */
function start(pool, n) {
  let qs = shuffle(pool);
  if (n !== "all") qs = qs.slice(0, +n);
  qs = qs.map(q => ({ ...q, options: shuffle(q.options) })); // les ids restent liés à la bonne réponse
  S = { qs, i: 0, picks: [], mode: prefs.mode, locked: false };
  question();
}

function question() {
  const q = S.qs[S.i], total = S.qs.length, train = S.mode === "train";
  app.innerHTML = `
    <div class="meta"><span>Question ${S.i + 1} / ${total}</span><span>${esc(q.theme)}</span></div>
    <div class="bar"><i style="width:${(S.i / total) * 100}%"></i></div>
    <h2>${esc(q.question)}</h2>
    <div id="opts">${q.options.map((o, k) => `
      <button class="opt" data-id="${o.id}"><b>${"ABCD"[k]}</b><span>${esc(o.text)}</span></button>`).join("")}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="actions"><button class="btn" id="next" disabled>${S.i + 1 === total ? "Voir le résultat" : "Question suivante"}</button>
      <button class="btn ghost" id="quit">Abandonner</button></div>`;
  S.locked = false; S.cur = null;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b.dataset.id));
  $("#next").onclick = next;
  $("#quit").onclick = () => confirm("Abandonner cette série ?") && home();
}

function pick(id) {
  if (S.locked) return;
  const q = S.qs[S.i], train = S.mode === "train";
  S.cur = id;
  const btns = app.querySelectorAll(".opt");
  if (train) {
    S.locked = true;
    const good = id === q.answer;
    btns.forEach(b => { b.disabled = true; if (b.dataset.id === q.answer) b.classList.add("ok"); else if (b.dataset.id === id) b.classList.add("ko"); });
    const fb = $("#fb");
    fb.className = "fb " + (good ? "ok" : "ko");
    fb.textContent = good ? "Bonne réponse." : "Mauvaise réponse. La bonne réponse est surlignée en vert.";
  } else {
    btns.forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  }
  $("#next").disabled = false;
  $("#next").focus();
}

function next() {
  if (S.cur == null) return;
  S.picks[S.i] = S.cur;
  if (++S.i < S.qs.length) question(); else result();
}

/* ---------- Résultat ---------- */
function result() {
  const total = S.qs.length;
  const wrong = S.qs.filter((q, i) => S.picks[i] !== q.answer);
  const good = total - wrong.length, pct = Math.round(good / total * 100);
  const txt = (q, id) => esc((q.options.find(o => o.id === id) || {}).text || "");
  app.innerHTML = `
    <h1>Résultat</h1>
    <div class="score">${good} / ${total}</div>
    <p class="sub">${pct} % de bonnes réponses.${wrong.length ? "" : " Aucune erreur, bravo."}</p>
    ${wrong.length ? `<h2>À revoir (${wrong.length})</h2>` : ""}
    ${wrong.map(q => `<div class="err"><p><strong>${esc(q.question)}</strong></p>
      <p class="bad">Ta réponse : ${txt(q, S.picks[S.qs.indexOf(q)])}</p>
      <p class="good">Bonne réponse : ${txt(q, q.answer)}</p></div>`).join("")}
    <div class="actions">
      ${wrong.length ? `<button class="btn" id="redo">Refaire mes erreurs</button>` : ""}
      <button class="btn ${wrong.length ? "ghost" : ""}" id="home">Nouvelle série</button></div>`;
  $("#home").onclick = home;
  if (wrong.length) $("#redo").onclick = () => start(wrong.map(({ options, ...q }) => ALL.find(a => a.id === q.id)), "all");
}

/* ---------- Clavier : A-D ou 1-4 pour répondre, Entrée pour continuer ---------- */
document.addEventListener("keydown", e => {
  if (!S || !app.querySelector(".opt") || e.ctrlKey || e.metaKey) return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) { const b = app.querySelectorAll(".opt")[k % 4]; if (b && !b.disabled) pick(b.dataset.id); }
  else if (e.key === "Enter" && !$("#next").disabled && document.activeElement.tagName !== "BUTTON") next();
});

home();
</script>
</body>
</html>
